<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flyers Review Unit 4 – Mini Test</title><style>:root{--b:#1265b5;--bg:#eef7ff;--ink:#17324d;--line:#cfe0ee;--good:#16804b;--bad:#c43b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#edf7ff,#f8fbff);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:16px}.head{position:sticky;top:8px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px #163f6515}.head h1{font-size:clamp(18px,3vw,28px);margin:0}.sp{flex:1}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.blue{background:var(--b);color:#fff}.light{background:#eff7ff;color:#07589f;border:1px solid #bfd8ee}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 6px 20px #164b7b0c}.id{display:grid;grid-template-columns:2fr 1fr;gap:12px}.lbl{font-size:12px;font-weight:800;color:#567086;margin-bottom:6px}.inp,.ans,textarea,select{width:100%;border:1.5px solid #c9dce9;border-radius:10px;padding:10px;background:#fbfdff}.sec{display:flex;align-items:center;gap:10px;margin-bottom:10px}.tag{background:var(--b);color:#fff;font-weight:900;padding:7px 11px;border-radius:9px}.sec h2{font-size:18px;color:#0e62aa;margin:0}.inst{font-weight:700;color:#536a7c;margin-bottom:8px}.q{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:13px 0;border-top:1px dashed #d8e4ec}.q:first-of-type{border-top:0}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e9f4ff;color:#075ca7;font-weight:900}.qt{font-weight:700;line-height:1.45}.ans{margin-top:8px}.choices{background:#f6fbff;border:1px solid #d7e9f7;border-radius:13px;padding:12px;margin:8px 0}.choice{padding:4px 0}.letters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.letter{width:38px;height:36px;border-radius:9px;border:1px solid #bfd5e7;background:#fff;font-weight:900;cursor:pointer}.letter.on{background:var(--b);color:#fff}.submit{display:flex;justify-content:flex-end;gap:8px;margin:18px 0 40px}.notice{display:none;background:#eefaf2;border:1px solid #b8dfc6;border-radius:14px;padding:14px;margin-top:14px}.notice.show{display:block}.modal{position:fixed;inset:0;background:#10283dbb;z-index:30;display:none;overflow:auto;padding:14px}.modal.show{display:block}.panel{max-width:1050px;margin:15px auto;background:#f7fbff;min-height:88vh;border-radius:18px;overflow:hidden}.phead{background:var(--b);color:#fff;padding:14px 16px;display:flex;align-items:center;position:sticky;top:0}.pbody{padding:16px}.login{max-width:400px;margin:50px auto;background:#fff;padding:20px;border:1px solid var(--line);border-radius:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{font-size:24px;color:#075da8;display:block}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid #c5d9e9;background:#fff;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.tab.on{background:var(--b);color:#fff}.tbl{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:10px;border-bottom:1px solid #e7eef4;text-align:left;font-size:13px}th{background:#f0f7fc}.review{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.meta{font-size:12px;color:#678096}.stud{font-weight:800;background:#f7fafc;padding:7px;border-radius:8px;margin:6px 0}.controls{display:grid;grid-template-columns:120px 1fr;gap:7px}.keyrow{display:grid;grid-template-columns:42px 1fr 110px;gap:7px;padding:7px 0;border-bottom:1px solid #edf2f6}.good{color:var(--good);font-weight:900}.bad{color:var(--bad);font-weight:900}.pending{color:#9b7415;font-weight:900}.toast{position:fixed;right:16px;bottom:16px;background:#17384f;color:#fff;border-radius:10px;padding:10px 13px;display:none;z-index:60}.toast.show{display:block}@media(max-width:700px){.id,.stats{grid-template-columns:1fr}.wrap{padding:9px}.card{padding:14px}.controls{grid-template-columns:1fr}.panel{margin:0;border-radius:0;min-height:100vh}}</style></head><body><div class="wrap"><div class="head"><div style="font-size:28px">📘</div><h1>FLYERS QUIZ – SCHOOL SUBJECTS & REVIEW</h1><div class="sp"></div><button class="btn light" onclick="openTeacher()">Teacher</button></div><div class="card id"><div><div class="lbl">STUDENT NAME *</div><input id="studentName" class="inp" placeholder="Full name"></div><div><div class="lbl">CLASS</div><input id="className" class="inp" placeholder="e.g. Flyers 1"></div></div><div id="quiz"></div><div id="result" class="notice"></div><div class="submit"><button class="btn light" onclick="clearForm()">Clear</button><button id="submitBtn" class="btn blue" onclick="submitQuiz()">SUBMIT TEST</button></div></div><div id="modal" class="modal"><div class="panel"><div class="phead"><b>Teacher Dashboard</b><div class="sp"></div><button class="btn light" onclick="closeTeacher()">Close</button></div><div id="teacher" class="pbody"></div></div></div><div id="toast" class="toast"></div><script>const API='https://xxnpmhvcbjntdgasskbn.supabase.co/functions/v1/flyers-u4-mini-test';const qs={1:'This school subject teaches students about numbers, shapes and calculations.',2:'In this subject, students learn about countries, maps, rivers, mountains and different places in the world.',3:'In this subject, students learn about things that happened in the past, such as old people, old places and important events.',4:'In this subject, students sing songs, listen to sounds and sometimes play instruments.',5:'In this subject, students run, jump, play sports and do exercise.',6:'What is the scarf made of? (wool / metal / paper)',7:'What are the computer mouses made of? (paper / plastic / wool)',8:'What is the magazine made of? (metal / paper / plastic)',9:'Sarah: Have you been there before?',10:'Sarah: What did you see?',11:'Sarah: Wow, that sounds interesting. Did you have a picnic?',12:'Sarah: Were there any old teachers there?',13:'Sarah: Did you take your camera?',14:'What animals? — mice, rabbits and ____',15:'What day? — every ____',16:'What time? — from ____ to 4.30',17:'Which teacher? — Mr ____',18:'Which classroom? — ____ room'};const responses={A:'We saw an old classroom with old desks and old books.',B:'Yes, I did. I took lots of great photos.',C:'Yes, I do. It’s excellent!',D:'We went to the Old School Museum. (Example)',E:'Yes, we ate our sandwiches in the old playground and then played on the old swings.',F:'No, it was my first time.',G:'We got to the museum at ten o’clock.',H:'No, there weren’t! There was only my teacher, Mrs Page, and she’s not old!'};let start=Date.now(),pin='',subs=[],keys=[],detail=null;function sec(n,title,inst,body){return `<div class="card"><div class="sec"><span class="tag">PART ${n}</span><h2>${title}</h2></div><div class="inst">${inst}</div>${body}</div>`}function textQs(arr,ph='Write your answer'){return arr.map(n=>`<div class="q"><div class="num">${n}</div><div><div class="qt">${qs[n]}</div><input class="ans" data-q="${n}" placeholder="${ph}"></div></div>`).join('')}function renderQuiz(){let html=sec(1,'MATCH THE DEFINITIONS','Read the definitions and write the correct word. There is no word bank.',textQs([1,2,3,4,5],'Write the school subject'));html+=sec(2,'BE MADE OF','Look at the pictures. Answer the questions.',textQs([6,7,8],'Write your full answer'));let list='<div class="choices"><b>Response list</b>'+Object.entries(responses).map(([l,t])=>`<div class="choice"><b>${l}.</b> ${t}</div>`).join('')+'</div>';let conv=[9,10,11,12,13].map(n=>`<div class="q"><div class="num">${n}</div><div><div class="qt">${qs[n]}</div><div class="letters" data-row="${n}">${['A','B','C','E','F','G','H'].map(l=>`<button class="letter" type="button" onclick="pick(${n},'${l}',this)">${l}</button>`).join('')}<input class="ans" type="hidden" data-q="${n}"></div></div></div>`).join('');html+=sec(3,'READING AND WRITING – CONVERSATION','Choose the best answer. Write a letter A–H for each answer.',list+conv);html+=sec(4,'LISTENING','Listen and write. There is one example.<div style="margin-top:7px;font-size:12px;color:#866719">The PDF contains the questions but not the audio file, so the teacher plays the class audio separately.</div>',textQs([14,15,16,17,18],'Write the missing word(s)'));document.getElementById('quiz').innerHTML=html}function pick(q,l,b){document.querySelectorAll(`[data-row="${q}"] .letter`).forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector(`.ans[data-q="${q}"]`).value=l}function answers(){let a={};document.querySelectorAll('.ans').forEach(x=>a[x.dataset.q]=x.value.trim());return a}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}async function post(action,data={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j=await r.json().catch(()=>({error:'Server response error'}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function submitQuiz(){let name=document.getElementById('studentName').value.trim();if(!name){toast('Please enter student name');return}let a=answers(),missing=Object.entries(a).filter(([k,v])=>!v).map(([k])=>k);if(missing.length&&!confirm('Questions '+missing.join(', ')+' are blank. Submit anyway?'))return;let b=document.getElementById('submitBtn');b.disabled=true;b.textContent='SUBMITTING…';try{let j=await post('submit',{student_name:name,class_name:document.getElementById('className').value.trim(),answers:a,duration_seconds:Math.round((Date.now()-start)/1000)});let r=document.getElementById('result');r.innerHTML=`<b>Submitted ✓</b><br>Auto score so far: <b>${j.auto_score} / ${18-j.pending_count}</b>${j.pending_count?`. ${j.pending_count} listening answer(s) are waiting for teacher key/review.`:''}`;r.classList.add('show');r.scrollIntoView({behavior:'smooth'});toast('Saved for teacher')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='SUBMIT TEST'}}function clearForm(){if(!confirm('Clear all answers?'))return;document.querySelectorAll('.ans').forEach(x=>x.value='');document.querySelectorAll('.letter').forEach(x=>x.classList.remove('on'));document.getElementById('result').classList.remove('show')}function openTeacher(){document.getElementById('modal').classList.add('show');document.getElementById('teacher').innerHTML='<div class="login"><h3>Teacher access</h3><p>No email login. Enter teacher PIN only.</p><input id="pin" class="inp" type="password" placeholder="PIN"><button class="btn blue" style="margin-top:10px" onclick="login()">Open dashboard</button></div>'}function closeTeacher(){document.getElementById('modal').classList.remove('show')}async function login(){try{let p=document.getElementById('pin').value,j=await post('teacher_overview',{pin:p});pin=p;subs=j.submissions||[];keys=j.keys||[];dashboard()}catch(e){toast('Wrong PIN or server error')}}function dashboard(){let avg=subs.length?(subs.reduce((s,x)=>s+Number(x.final_score||0),0)/subs.length).toFixed(1):'–';document.getElementById('teacher').innerHTML=`<div class="stats"><div class="stat">Submissions<b>${subs.length}</b></div><div class="stat">Average<b>${avg}</b></div><div class="stat">New<b>${subs.filter(x=>!x.teacher_reviewed).length}</b></div></div><div class="tabs"><button class="tab on" onclick="showSubs(this)">Submissions</button><button class="tab" onclick="showKey(this)">Answer key</button><button class="tab" onclick="showPin(this)">Change PIN</button></div><div id="area"></div>`;showSubs()}function selectTab(btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on')}function showSubs(btn){if(btn)selectTab(btn);let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Student submissions</b><button class="btn light" onclick="refresh()">↻ Refresh</button></div><div class="tbl"><table><thead><tr><th>Student</th><th>Class</th><th>Submitted</th><th>Auto</th><th>Final</th><th>Status</th><th></th></tr></thead><tbody>';if(!subs.length)h+='<tr><td colspan="7">No submissions yet.</td></tr>';for(let s of subs)h+=`<tr><td><b>${esc(s.student_name)}</b></td><td>${esc(s.class_name||'–')}</td><td>${new Date(s.created_at).toLocaleString()}</td><td>${s.auto_score}/18</td><td><b>${s.final_score}/18</b></td><td>${s.teacher_reviewed?'<span class="good">Reviewed</span>':'<span class="pending">New</span>'}</td><td><button class="btn light" onclick="openDetail('${s.id}')">View & edit</button></td></tr>`;h+='</tbody></table></div>';document.getElementById('area').innerHTML=h}async function refresh(){try{let j=await post('teacher_overview',{pin});subs=j.submissions||[];keys=j.keys||[];dashboard();toast('Updated')}catch(e){toast(e.message)}}async function openDetail(id){try{detail=await post('teacher_detail',{pin,id});renderDetail()}catch(e){toast(e.message)}}function renderDetail(){let d=detail,h=`<button class="btn light" onclick="showSubs()">← Back</button><h3>${esc(d.submission.student_name)} · ${esc(d.submission.class_name||'No class')}</h3>`;for(let r of d.grades){let k=d.keys.find(x=>x.question_no===r.question_no)||{},auto=r.auto_points===null?'<span class="pending">Pending</span>':Number(r.auto_points)>0?'<span class="good">Auto correct</span>':'<span class="bad">Auto wrong</span>';let val=r.teacher_points==null?'auto':String(r.teacher_points);h+=`<div class="review"><div class="meta">Question ${r.question_no} · Part ${k.part_no} · ${auto}</div><div>${esc(d.question_text[String(r.question_no)]||'')}</div><div class="stud">Student: ${r.student_answer?esc(r.student_answer):'<i>blank</i>'}</div><div class="meta">Accepted: ${(k.accepted_answers||[]).length?esc(k.accepted_answers.join(', ')):'Teacher review / key not set'}</div><div class="controls"><select data-grade="${r.question_no}"><option value="auto" ${val==='auto'?'selected':''}>Use auto</option><option value="1" ${val==='1'?'selected':''}>1 point</option><option value="0" ${val==='0'?'selected':''}>0 points</option></select><input class="inp" data-comment="${r.question_no}" value="${attr(r.teacher_comment||'')}" placeholder="Teacher comment"></div></div>`}h+=`<div class="card" style="margin-top:8px"><div class="lbl">OVERALL NOTE</div><textarea id="note" rows="4">${esc(d.submission.teacher_note||'')}</textarea><button class="btn blue" style="margin-top:9px" onclick="saveReview()">Save corrections</button></div>`;document.getElementById('area').innerHTML=h}async function saveReview(){let o={};document.querySelectorAll('[data-grade]').forEach(s=>{let q=s.dataset.grade;o[q]={teacher_points:s.value==='auto'?null:Number(s.value),teacher_comment:document.querySelector(`[data-comment="${q}"]`).value}});try{let j=await post('save_review',{pin,id:detail.submission.id,overrides:o,teacher_note:document.getElementById('note').value});toast('Saved. Final '+j.final_score+'/18');await refresh()}catch(e){toast(e.message)}}function showKey(btn){if(btn)selectTab(btn);let h='<div class="card" style="margin-top:0"><p><b>Accepted answers</b>: separate variants with |. Saving re-grades previous submissions but keeps teacher overrides.</p><div class="keyrow"><b>Q</b><b>Answers</b><b>Mode</b></div>';for(let k of keys)h+=`<div class="keyrow"><b>${k.question_no}</b><input class="inp" data-key="${k.question_no}" value="${attr((k.accepted_answers||[]).join(' | '))}"><select data-mode="${k.question_no}"><option value="exact" ${k.grading_mode==='exact'?'selected':''}>Exact</option><option value="contains" ${k.grading_mode==='contains'?'selected':''}>Contains</option><option value="manual" ${k.grading_mode==='manual'?'selected':''}>Manual</option></select></div>`;h+='<button class="btn blue" style="margin-top:10px" onclick="saveKey()">Save key & re-grade</button></div>';document.getElementById('area').innerHTML=h}async function saveKey(){let a=[];document.querySelectorAll('[data-key]').forEach(i=>{let q=Number(i.dataset.key);a.push({question_no:q,grading_mode:document.querySelector(`[data-mode="${q}"]`).value,accepted_answers:i.value.split('|').map(x=>x.trim()).filter(Boolean)})});try{let j=await post('save_key',{pin,keys:a});toast('Saved; '+j.regraded+' submission(s) re-graded');await refresh()}catch(e){toast(e.message)}}function showPin(btn){if(btn)selectTab(btn);document.getElementById('area').innerHTML='<div class="login" style="margin:0"><h3>Change teacher PIN</h3><input id="newpin" class="inp" type="password" placeholder="At least 6 characters"><button class="btn blue" style="margin-top:9px" onclick="changePin()">Change PIN</button></div>'}async function changePin(){let n=document.getElementById('newpin').value;if(n.length<6){toast('At least 6 characters');return}try{await post('change_pin',{pin,new_pin:n});pin=n;toast('PIN changed')}catch(e){toast(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attr(s){return esc(s)}renderQuiz();</script></body></html>
